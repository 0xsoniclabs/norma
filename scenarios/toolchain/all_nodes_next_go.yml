Name: All Nodes on Next Go Toolchain

Description: >-
  Verifies that a whole network built with the next Go toolchain
  produces blocks under representative load — the plain "does Sonic
  work at all under the next Go release" regression. Rotate goVersion
  when the next Go release changes; it must exist as a
  golang:<version> tag on Docker Hub.

Scenario:
  - startNode: validator
    type: validator
    goVersion: "1.27rc2"
    instances: 3

  - runApp: load
    type: counter
    users: 10
    rate:
      constant: 10

  - waitFor: 60s

  - checks:
      - blocksProduced:
          tolerance: 10
