Name: Rejoin Upgraded With Data Volume
Description: >-
  Tests that a validator can be stopped, upgraded, and
  rejoined using a persistent data volume.

Scenario:
  - startNode: stable-validator
    type: validator
    instances: 3

  - waitForEpoch

  - startNode: migrating-validator
    type: validator
    imageName: "sonic:v2.2.0"
    dataVolume: validator-data

  - waitForEpoch

  - waitFor: 15s

  - stopNode: migrating-validator

  - startNode: migrating-validator
    type: validator
    dataVolume: validator-data

  - waitForEpoch

  # The upgraded databases must pass sonictool check. stable-validator-0 is
  # the control: never interrupted, checked the same way, with 15M of the
  # 20M stake online while it is stopped.
  - stopSonic: migrating-validator
  - checkDb: migrating-validator
    mode: live
  - checkDb: migrating-validator
    mode: archive
  - startNode: migrating-validator
    type: validator

  - stopSonic: stable-validator-0
  - checkDb: stable-validator-0
    mode: live
  - checkDb: stable-validator-0
    mode: archive
  - startNode: stable-validator-0
    type: validator
