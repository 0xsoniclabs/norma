Name: Toggle Bundles Off And On

Description: >-
  Toggles TransactionBundles off and on while keeping the network
  live. Subsidized bundle traffic runs again after re-enabling.
  v2.2.0 is the oldest release that implements bundles, so it joins
  the candidate for both rule transitions. v2.1.6 has no bundle
  support at all and cannot participate.

InitialNetworkRules:
  Upgrades:
    Sonic: true
    Allegro: true
    GasSubsidies: true
    Brio: true
    TransactionBundles: true

Scenario:
  - startNode: validators
    type: validator
    instances: 2
    stake: 4000000 # 80% of stake, so a v2.2.0 fork shows up as a hash
                   # mismatch instead of stalling the network

  - startNode: validator-v220
    type: validator
    imageName: "sonic:v2.2.0"
    stake: 2000000

  - runApp: baseline
    type: counter
    users: 20
    rate:
      constant: 10

  - runApp: bundles-load
    type: subsidizedbundle
    users: 10
    rate:
      constant: 5

  - waitFor: 15s

  - updateRules:
      Upgrades:
        TransactionBundles: false

  - waitForEpoch

  - checks:
      - blocksProduced:
          tolerance: 10
      - networkRules:
          rules:
            Upgrades:
              Sonic: true
              Allegro: true
              GasSubsidies: true
              Brio: true
              TransactionBundles: false

  - stopApp: bundles-load

  - stopApp: baseline

  - waitFor: 10s

  - updateRules:
      Upgrades:
        TransactionBundles: true

  - waitForEpoch

  - checks:
      - blocksProduced:
          tolerance: 10
      - networkRules:
          rules:
            Upgrades:
              Sonic: true
              Allegro: true
              GasSubsidies: true
              Brio: true
              TransactionBundles: true

  - runApp: baseline-reenabled
    type: counter
    users: 20
    rate:
      constant: 10

  - runApp: bundles-load
    type: subsidizedbundle
    users: 10
    rate:
      constant: 5

  - waitFor: 20s
