Name: Toggle Subsidies Off And On

Description: >-
  Toggles GasSubsidies off and on while keeping the network live.
  Subsidies traffic runs again after re-enabling the feature. The
  validator set spans v2.1.6, v2.2.0 and the candidate, so both rule
  transitions have to be applied coherently by every version.

InitialNetworkRules:
  Upgrades:
    Sonic: true
    Allegro: true
    GasSubsidies: true

Scenario:
  - startNode: validators
    type: validator
    instances: 2
    stake: 4000000 # 80% of stake, so a released-client fork shows up as a hash
                   # mismatch instead of stalling the network

  - startNode: validator-v216
    type: validator
    imageName: "sonic:v2.1.6"
    stake: 1000000

  - startNode: validator-v220
    type: validator
    imageName: "sonic:v2.2.0"
    stake: 1000000

  - runApp: baseline
    type: counter
    users: 20
    rate:
      constant: 10

  - runApp: subsidies-load
    type: subsidies
    users: 10
    rate:
      constant: 10

  - waitFor: 15s

  - updateRules:
      Upgrades:
        GasSubsidies: false

  - waitForEpoch

  - checks:
      - blocksProduced:
          tolerance: 10
      - networkRules:
          rules:
            Upgrades:
              Sonic: true
              Allegro: true
              GasSubsidies: false

  - stopApp: subsidies-load

  - stopApp: baseline

  - waitFor: 10s

  - updateRules:
      Upgrades:
        GasSubsidies: true

  - waitForEpoch

  - checks:
      - blocksProduced:
          tolerance: 10
      - networkRules:
          rules:
            Upgrades:
              Sonic: true
              Allegro: true
              GasSubsidies: true

  - runApp: baseline-reenabled
    type: counter
    users: 20
    rate:
      constant: 10

  - runApp: subsidies-load
    type: subsidies
    users: 10
    rate:
      constant: 10

  - waitFor: 20s
