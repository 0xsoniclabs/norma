Name: Release Stress Multi Node Single Bundle Slope

Description: >-
  Multi-validator stress test with subsidized bundle traffic and
  sloping load. The network remains live while throughput pressure
  increases.

# Transaction checks are off: the sloping load deliberately drives the network
# past its capacity, so transactions are expected to be dropped once the
# transaction pool saturates.
DisableTransactionChecks: true

InitialNetworkRules:
  Upgrades:
    Sonic: true
    Allegro: true
    GasSubsidies: true
    Brio: true
    TransactionBundles: true

Scenario:
  - startNode: validators
    type: validator
    instances: 4

  - runApp: bundles-slope
    type: subsidizedbundle
    users: 100
    rate:
      slope:
        start: 20
        increment: 5

  - waitFor: 90s