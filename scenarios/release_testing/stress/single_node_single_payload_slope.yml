Name: Release Stress Single Node Single Payload Slope

Description: >-
  Single-validator stress test with one transaction payload and
  sloping load. Block production remains active during the stress
  window.

# Transaction checks are off: the sloping load deliberately drives the network
# past its capacity, so transactions are expected to be dropped once the
# transaction pool saturates.
DisableTransactionChecks: true

Scenario:
  - startNode: validator-0
    type: validator

  - runApp: counter-slope
    type: counter
    users: 50
    rate:
      slope:
        start: 10
        increment: 2

  - waitFor: 60s

  - checks:
      - blocksProduced:
          tolerance: 10
