Name: Release Stress Single Node Single Bundle Slope

Description: >-
  Single-validator stress test with subsidized bundle traffic and
  sloping load. Transaction bundles remain active with required
  upgrades enabled at genesis.

# Transaction checks are off: the sloping load deliberately drives the network
# past its capacity, so transactions are expected to be dropped once the
# transaction pool saturates.
DisableTransactionChecks: true

InitialNetworkRules:
  Upgrades:
    Sonic: true
    Allegro: true
    GasSubsidies: true
    Brio: true
    TransactionBundles: true

Scenario:
  - startNode: validator-0
    type: validator

  - runApp: bundles-slope
    type: subsidizedbundle
    users: 50
    rate:
      slope:
        start: 10
        increment: 2

  - waitFor: 60s