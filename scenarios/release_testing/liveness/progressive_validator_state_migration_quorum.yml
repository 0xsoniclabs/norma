Name: Liveness Progressive Validator State Migration Quorum

Description: >-
  Verifies liveness while progressively migrating four validators to
  the candidate without undelegation. Two start on v2.1.6 and two on
  v2.2.0, so both supported upgrade paths are exercised in one run.
  Block production continues throughout every stop/restart window, and
  all four migrated databases end up on the same block hashes.

Scenario:
  - startNode: validator-1
    type: validator
    imageName: "sonic:v2.1.6"
    dataVolume: validator-1-data

  - startNode: validator-2
    type: validator
    imageName: "sonic:v2.1.6"
    dataVolume: validator-2-data

  - startNode: validator-3
    type: validator
    imageName: "sonic:v2.2.0"
    dataVolume: validator-3-data

  - startNode: validator-4
    type: validator
    imageName: "sonic:v2.2.0"
    dataVolume: validator-4-data

  - runApp: migration-load
    type: counter
    users: 20
    rate:
      constant: 20

  - waitFor: 20s

  - stopNode: validator-1
  - waitFor: 15s
  - checks:
      - blocksProduced:
          tolerance: 10
  - startNode: validator-1
    type: validator
    dataVolume: validator-1-data
  - waitFor: 15s
  - checks:
      - blocksProduced:
          tolerance: 10

  - stopNode: validator-2
  - waitFor: 15s
  - checks:
      - blocksProduced:
          tolerance: 10
  - startNode: validator-2
    type: validator
    dataVolume: validator-2-data
  - waitFor: 15s
  - checks:
      - blocksProduced:
          tolerance: 10

  - stopNode: validator-3
  - waitFor: 15s
  - checks:
      - blocksProduced:
          tolerance: 10
  - startNode: validator-3
    type: validator
    dataVolume: validator-3-data
  - waitFor: 15s
  - checks:
      - blocksProduced:
          tolerance: 10

  - stopNode: validator-4
  - waitFor: 15s
  - checks:
      - blocksProduced:
          tolerance: 10
  - startNode: validator-4
    type: validator
    dataVolume: validator-4-data
  - waitFor: 15s
  - checks:
      - blocksProduced:
          tolerance: 10
