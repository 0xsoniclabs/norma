Name: Liveness DB Heal Bundles After Two Epochs

Description: >-
  Runs transaction bundles across three local validators and SIGKILLs a
  low-stake one twice: first while the chain is inside the 1024-block bundle
  replay window, then another once it is past it. Each killed node's database
  is left dirty and it is kept down for two epochs while the remaining quorum
  keeps processing bundles. The database is healed and the node restarted in
  place, and it must sync back through the bundle-bearing blocks and epoch
  seals it missed.

InitialNetworkRules:
  Upgrades:
    Sonic: true
    Allegro: true
    GasSubsidies: true
    Brio: true
    TransactionBundles: true
  Emitter:
    # A sixth of the default 600ms, which measured ~0.84 blocks/s here: the
    # 1024 blocks below would not fit the scenario deadline otherwise.
    Interval: 100ms
  Blocks:
    # Lowest value the client accepts; keeps blocks coming through any lull
    # in the load.
    MaxEmptyBlockSkipPeriod: 4s
  Epochs:
    # Short epochs, so the two-epoch outage stays well inside the deadline.
    MaxEpochDuration: 20s

Scenario:
  # Quorum holder: 71% of the stake stays online throughout, above the 2/3
  # needed, so block production never depends on the nodes under test.
  - startNode: stable
    type: validator
    stake: 5_000_000

  # Healed past the 1024-block bundle replay window.
  - startNode: frail
    type: validator
    stake: 1_000_000
    extraArguments: "--statedb.checkpointinterval 1"

  # Healed inside the window, which then reaches back before the first bundle.
  - startNode: frail-in-window
    type: validator
    stake: 1_000_000
    extraArguments: "--statedb.checkpointinterval 1"

  # The bundles are submitted through the stable node only, so none are sent
  # to a frail one while it is down.
  - runApp: all-of
    type: allofbundle
    users: 10
    rate:
      constant: 5
    nodes: [stable]

  - runApp: one-of
    type: oneofbundle
    users: 10
    rate:
      constant: 5
    nodes: [stable]

  - runApp: subsidized
    type: subsidizedbundle
    users: 10
    rate:
      constant: 5
    nodes: [stable]

  # First heal inside the 1024-block bundle replay window: the window of the
  # restored seal reaches back before the first bundle.
  - waitForBlocks: 500
  - advanceEpoch
  - waitFor: 15s

  - killSonic: frail-in-window

  - checks:
      - blocksProduced

  - waitForEpoch
  - waitForEpoch

  - healDb: frail-in-window
  - startNode: frail-in-window
    type: validator

  # Grown past the 1024-block bundle replay window, so the second node is
  # killed with a full window of bundle history behind it; two more epochs are
  # sealed on top of it.
  - waitForBlocks: 600
  - advanceEpoch
  - advanceEpoch

  # Heal rolls back to the last seal, so only the blocks after it are
  # re-executed; give them bundles. Kept under MaxEpochDuration so no seal
  # lands in between.
  - waitFor: 15s

  - killSonic: frail

  - checks:
      - blocksProduced

  # The outage: the network seals two epochs of bundles without the node.
  - waitForEpoch
  - waitForEpoch

  # The restart is the assertion: the runner waits for the node to reach the
  # network height and fails the step if it never gets there.
  - healDb: frail
  - startNode: frail
    type: validator

  - waitFor: 20s

  - stopApp: all-of
  - stopApp: one-of
  - stopApp: subsidized

  - checks:
      - validatorsActive
