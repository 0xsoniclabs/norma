Name: Brio Fork Supermajority v2.1.6 v2.2.0

Description: >-
  Verifies supermajority liveness across a mixed v2.1.6/v2.2.0
  validator set when Brio is enabled. The sonic:v2.2.0 supermajority
  keeps the network online while Brio-era load executes.

InitialNetworkRules:
  Upgrades:
    Sonic: true
    Allegro: true
    Brio: false

Scenario:
  - startNode: validator-v220
    type: validator
    imageName: "sonic:v2.2.0"
    stake: 7000000

  - startNode: validator-v216
    type: validator
    imageName: "sonic:v2.1.6"
    stake: 3000000
    failing: true

  - runApp: baseline
    type: counter
    users: 20
    rate:
      constant: 20

  - waitFor: 20s

  - updateRules:
      Upgrades:
        Brio: true

  - waitForEpoch

  - runApp: brio-large-contract
    type: largecontract
    users: 10
    rate:
      constant: 6

  - waitFor: 40s

  - checks:
      - blocksProduced:
          tolerance: 10
