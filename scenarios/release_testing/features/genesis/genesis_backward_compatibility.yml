Name: Genesis Backward Compatibility

Description: >-
  A v2.2.0 client, the first release of the current release branch,
  exports a g-file on an epoch boundary, and a fresh candidate node
  bootstraps from it, joins the network and follows the chain. Rotate the
  exporter when a new release branch opens.

InitialNetworkRules:
  Upgrades:
    Sonic: true
    Allegro: true
    GasSubsidies: false
    Brio: false
  Epochs:
    # Short epochs, so the g-file carries many sealed epochs of history.
    MaxEpochDuration: 10s

Scenario:
  - startNode: validator
    type: validator
    stake: 50_000_000

  # Checkpoints every block let healDb roll back to the latest sealed epoch.
  - startNode: exporter-v220
    type: observer
    imageName: "sonic:v2.2.0"
    extraArguments: "--statedb.checkpointinterval 1"

  # Transaction volume and account churn.
  - runApp: counter
    type: counter
    users: 20
    rate:
      constant: 20

  - runApp: tokens
    type: erc20
    users: 10
    rate:
      constant: 10

  - runApp: swaps
    type: uniswap
    users: 5
    rate:
      constant: 5

  # Storage growth: each transaction allocates 260 fresh slots for ~6.5 MGas,
  # so 0.5/s keeps the total well under the network's gas target.
  - runApp: bulk
    type: store
    users: 5
    rate:
      constant: 0.5

  - waitForBlocks: 100

  - stopApp: counter
  - stopApp: tokens
  - stopApp: swaps
  - stopApp: bulk

  # healDb reverts to the start of the epoch the database last flushed in
  # (SCENARIO_SPECIFICATION.md 3.12). Flushes follow write volume, so the last
  # one falls near the end of the load, and short epochs keep the boundary
  # close to it: the g-file holds nearly all of the load.
  - killSonic: exporter-v220
  - healDb: exporter-v220

  - exportGenesis: exporter-v220
    file: from-v220.g

  - prepareNode: fresh-local
    type: observer
    file: from-v220.g
  - checkDb: fresh-local
    mode: live
  - checkDb: fresh-local
    mode: archive
  - startNode: fresh-local
    type: observer
