Name: Genesis Legacy Compatibility

Description: >-
  A v2.1.6 client, the last release before the g-file format changed in
  v2.2.0, exports a g-file on an epoch boundary, and a fresh candidate node
  bootstraps from it, joins the network and follows the chain. Brio stays
  off so the exporter can follow the chain. Never rotate the exporter.

InitialNetworkRules:
  Upgrades:
    Sonic: true
    Allegro: true
    GasSubsidies: false
    Brio: false

Scenario:
  - startNode: validator
    type: validator
    stake: 50_000_000

  # Checkpoints every block let healDb roll back to the latest sealed epoch.
  - startNode: exporter-v216
    type: observer
    imageName: "sonic:v2.1.6"
    extraArguments: "--statedb.checkpointinterval 1"

  - runApp: load
    type: counter
    users: 5
    rate:
      constant: 10

  - waitFor: 20s

  - stopApp: load

  # healDb restores the state of the last completed epoch, so the export is
  # taken on an epoch boundary (SCENARIO_SPECIFICATION.md 3.12).
  - killSonic: exporter-v216
  - healDb: exporter-v216

  - exportGenesis: exporter-v216
    file: from-v216.g

  - prepareNode: fresh-local
    type: observer
    file: from-v216.g
  - checkDb: fresh-local
    mode: live
  - checkDb: fresh-local
    mode: archive
  - startNode: fresh-local
    type: observer
