Name: High Load Five Validators

Description: >-
  Stress-tests single proposer mode under heavy transaction load
  with multiple validators. Block production remains consistent and
  no hash divergence occurs under stress.

# Transaction checks are off: the load is high enough that following every
# transaction would compete with the load itself for throughput.
DisableTransactionChecks: true

InitialNetworkRules:
  Upgrades:
    Sonic: true
    Allegro: true
    SingleProposerBlockFormation: true

Scenario:
  - startNode: validator
    type: validator
    instances: 5

  - runApp: heavy-load
    type: counter
    users: 1000
    rate:
      constant: 500

  - waitFor: 60s

  - checks:
      - blocksProduced:
          tolerance: 10

  - waitFor: 60s

  - checks:
      - blocksProduced:
          tolerance: 10

  - stopApp: heavy-load
