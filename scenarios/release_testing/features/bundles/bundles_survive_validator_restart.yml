Name: Bundles Survive Validator Restart

Description: >-
  Validates bundle-processing compatibility among all currently
  bundle-capable clients - v2.2.0 and the candidate. Validators process
  subsidized bundles concurrently while nodes remain synchronized and
  block production stays stable, including across the restart of one
  candidate validator. v2.1.6 has no bundle support and is excluded.

InitialNetworkRules:
  Upgrades:
    Sonic: true
    Allegro: true
    GasSubsidies: true
    Brio: true
    TransactionBundles: true

Scenario:
  - startNode: validator-local-a
    type: validator
    stake: 4000000

  - startNode: validator-v220
    type: validator
    imageName: "sonic:v2.2.0"
    stake: 3000000

  - startNode: validator-local-c
    type: validator
    stake: 3000000

  - runApp: baseline
    type: counter
    users: 30
    rate:
      constant: 15

  - runApp: bundles-load
    type: subsidizedbundle
    users: 15
    rate:
      constant: 8

  - waitFor: 30s

  - checks:
      - blocksProduced:
          tolerance: 10
      # Not redundant with the implicit end checks: validator-local-c restarts
      # without a dataVolume, so it re-syncs from the network and any divergence
      # it had before the stop is gone from its own history by then.
      - blockHashes

  - stopNode: validator-local-c

  - waitFor: 15s

  - checks:
      - blocksProduced:
          tolerance: 10

  - startNode: validator-local-c
    type: validator

  - waitFor: 20s

  - checks:
      - blocksProduced:
          tolerance: 10