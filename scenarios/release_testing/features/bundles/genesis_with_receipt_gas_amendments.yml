Name: Genesis With Receipt Gas Amendments Across Versions

Description: >-
  A v2.2.3 validator, whose pool still admits bundles with a bare transaction
  root, takes bare-root bundles that fail in part, leaking their gas into the
  cumulative gas of the receipts after them. A candidate observer records the
  receipt gas amendments of those blocks and exports its chain at an epoch
  seal to a g-file carrying them. The g-file is imported by a v2.2.4 node,
  which predates the amendments section, and by a candidate node, and both
  must sync back with the network and follow it across further epoch seals.
  The candidate importer must report the receipt gas the amendments correct,
  and v2.2.4 the leaked one.

InitialNetworkRules:
  Upgrades:
    Sonic: true
    Allegro: true
    GasSubsidies: true
    Brio: true
    TransactionBundles: true
  Epochs:
    # Short epochs, so the exporter reaches its exit epoch, and the importers
    # cross seals, within the scenario deadline.
    MaxEpochDuration: 10s

Scenario:
  - startNode: validator-local
    type: validator

  - startNode: validator-v223
    type: validator
    imageName: "sonic:v2.2.3"

  # A g-file has to end at an epoch seal, so the exporter stops itself right
  # after one; the network is a few epochs in when it starts.
  - startNode: exporter
    type: observer
    extraArguments: "--exitwhensynced.epoch 20"

  # Clients from v2.2.4 on reject bare-root bundles at pool admission, so
  # they are submitted through the v2.2.3 validator only.
  - runApp: failing-root
    type: failingrootbundle
    users: 10
    rate:
      constant: 5
    nodes: [validator-v223]

  # Fills the blocks with transactions after the failed bundles, whose
  # receipts carry the leaked gas.
  - runApp: baseline
    type: counter
    users: 10
    rate:
      constant: 10
    nodes: [validator-v223]

  - waitForSonicExit: exporter
  - exportGenesis: exporter
    file: amended.g

  # Each importer replaces its database with the g-file and is restarted in
  # place, which waits for it to reach the network height.
  - startNode: importer-v224
    type: observer
    imageName: "sonic:v2.2.4"
  - stopSonic: importer-v224
  - importGenesis: importer-v224
    file: amended.g
  - startNode: importer-v224
    type: observer

  - startNode: importer-local
    type: observer
  - stopSonic: importer-local
  - importGenesis: importer-local
    file: amended.g
  - startNode: importer-local
    type: observer

  # The importers must follow the network across new blocks and seals.
  - waitFor: 30s

  - stopApp: failing-root
  - stopApp: baseline

  - checks:
      - blocksProduced
      - blockHashes
      # The candidate validator processed every block itself, while the
      # candidate importer took the blocks up to the export from the g-file:
      # agreeing with it shows the amendments were carried through, and
      # v2.2.4, which ignores them, shows there was a leak to correct.
      - receiptGasUsed:
          amended: [validator-local, importer-local]
          leaked: [importer-v224]
