Name: Failing Bundle Load Test
Description: >-
  Runs the failingbundle load generator against a single validator to verify bundles containing failing transactions are handled correctly.

InitialNetworkRules:
  Upgrades:
    Sonic: true
    Allegro: true
    Brio: true
    GasSubsidies: true
    TransactionBundles: true

Scenario:
  - startNode: validator
    type: validator

  - runApp: failingbundle
    type: failingbundle
    users: 10
    rate:
      # A bundle reads the nonces of its inner transactions from the chain, and a
      # pool does not report the nonces inside an envelope as taken. Producing
      # bundles faster than they are executed would make their plans unexecutable.
      constant: 2

  - waitFor: 30s

  - stopApp: failingbundle
