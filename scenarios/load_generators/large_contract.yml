Name: Large Contract Load Test
Description: >-
  Runs the largecontract load generator against a single validator to verify large contract deployment transactions are processed correctly.

InitialNetworkRules:
  Upgrades:
    Sonic: true
    Allegro: true
    Brio: true

Scenario:
  - startNode: validator
    type: validator

  - runApp: largecontract
    type: largecontract
    users: 10
    rate:
      # Each transaction deploys ~48 KiB of bytecode for about 12M gas, so a block
      # holds barely more than one of them. A higher rate would only pile up in the
      # transaction pool.
      constant: 1

  - waitFor: 30s

  - stopApp: largecontract
