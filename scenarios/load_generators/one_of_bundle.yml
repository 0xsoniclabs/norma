Name: One-Of Bundle Load Test
Description: >-
  Runs the oneofbundle load generator against a single validator to verify one-of transaction bundles are processed correctly.

InitialNetworkRules:
  Upgrades:
    Sonic: true
    Allegro: true
    Brio: true
    GasSubsidies: true
    TransactionBundles: true

Scenario:
  - startNode: validator
    type: validator

  - runApp: oneofbundle
    type: oneofbundle
    users: 10
    rate:
      # A bundle reads the nonces of its inner transactions from the chain, and a
      # pool does not report the nonces inside an envelope as taken. Producing
      # bundles faster than they are executed would make their plans unexecutable.
      constant: 2

  - waitFor: 30s

  - stopApp: oneofbundle
