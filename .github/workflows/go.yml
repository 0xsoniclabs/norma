name: Go

permissions:
  contents: read
  checks: write
  pull-requests: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    # `lint` is a required status check, so the job must always report. Filter
    # here rather than on the trigger: a path-filtered job that never starts
    # never reports, and PRs with no Go changes stay blocked forever.
    - name: look for go changes
      id: changed
      uses: dorny/paths-filter@v4
      with:
        filters: |
          go:
           - '.github/workflows/go.yml'
           - '.golangci.yml'
           - '**/*.go'
           - 'go.mod'
    - name: setup go
      if: steps.changed.outputs.go == 'true'
      uses: actions/setup-go@v7 # Use actions/setup-go to specify the Go version
      with:
        go-version: "1.26.0"
        cache-dependency-path: go/go.sum
    - name: golangci-lint go
      if: steps.changed.outputs.go == 'true'
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        working-directory: .